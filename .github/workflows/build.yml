name: Build
'on':
  push:
    branches:
      - '**'
  workflow_call:
jobs:
  # Linux build job (matrixed by OS and compiler)  
  linux-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            packages: gcc g++
            cc: gcc
            cxx: g++
          - compiler: clang
            packages: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v2
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: update apt
        run: sudo apt update
      - name: install dependencies
        run: sudo apt install -y cmake ${{ matrix.packages }}
      - name: cmake
        run: mkdir build && cd build && cmake ..
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: make
        run: cd build && make
      - name: tests
        run: cd build && ctest --output-on-failure
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pfaedle-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/pfaedle
          archive: false

  # macOS build job (matrixed by macOS version)
  macos-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, macOS-15]
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v2
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: install dependencies
        run: brew install cmake
      - name: cmake
        run: mkdir build && cd build && cmake ..
      - name: make
        run: cd build && make
      - name: tests
        run: cd build && ctest --output-on-failure
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pfaedle-${{ matrix.os }}
          path: build/pfaedle
          archive: false
