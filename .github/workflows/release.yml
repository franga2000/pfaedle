name: Release
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
